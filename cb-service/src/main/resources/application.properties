spring.application.name=cb-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cherrybite
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# Default schema
spring.jpa.properties.hibernate.default_schema=cb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect (optional for newer Spring Boot versions)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
